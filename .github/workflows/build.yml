name: Build Sonic Mania Decompilation (Android)

on:
  push:
    branches:
      - master

jobs:
  mania-android:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Repositories
      - name: Checkout RSDKv5 (Engine Root)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Sonic Mania Decompilation
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/Sonic-Mania-Decompilation"
          path: "Sonic-Mania-Decompilation"
          submodules: recursive

      - name: Checkout GameAPI
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-GameAPI"
          path: "RSDKv5-GameAPI"

      - name: Checkout Example Mods
        uses: actions/checkout@v4
        with:
          repository: "RSDKModding/RSDKv5-Example-Mods"
          path: "RSDKv5-Example-Mods"

      # Step 2: Setup Android Build Tools
      - name: Setup Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 2.5: Setup Engine Android Dependencies
      - name: Link RSDKv5 to Mania Dependencies
        run: |
          rmdir $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5 || true
          ln -s $PWD $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5

      - name: Setup Engine Android Dependencies
        working-directory: ./Sonic-Mania-Decompilation/dependencies/RSDKv5/dependencies/android
        run: |
          curl -L -O https://downloads.xiph.org/releases/ogg/libogg-1.3.5.zip
          curl -L -O https://downloads.xiph.org/releases/theora/libtheora-1.1.1.zip
          unzip \*.zip
          rm *.zip
          rsync -ar libogg-*/* libogg
          mv libtheora-* libtheora

      # Step 3: Create Symlinks using $PWD
      - name: Create Symlinks
        run: |
          # JNI directory inside Mania's RSDKv5 dependency structure
          JNI_DIR="$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5/dependencies/android/app/jni"

          # Remove existing target entries if present
          rm -f $JNI_DIR/Game $JNI_DIR/MTC $JNI_DIR/UWM

          # Create JNI Symlinks pointing to target repos using $PWD
          ln -s $PWD/Sonic-Mania-Decompilation $JNI_DIR/Game
          ln -s $PWD/RSDKv5-Example-Mods/ManiaTouchControls $JNI_DIR/MTC
          ln -s $PWD/RSDKv5-Example-Mods/UltrawideMania $JNI_DIR/UWM

          # Create GameAPI Symlinks inside MTC and UWM using $PWD
          rm -f $PWD/RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          rm -f $PWD/RSDKv5-Example-Mods/UltrawideMania/GameAPI
          ln -s $PWD/RSDKv5-GameAPI $PWD/RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          ln -s $PWD/RSDKv5-GameAPI $PWD/RSDKv5-Example-Mods/UltrawideMania/GameAPI

      # Step 4: Build
      - name: Build APK
        working-directory: ./Sonic-Mania-Decompilation/dependencies/RSDKv5/dependencies/android
        run: |
          ./gradlew assembleRelease --no-daemon -PABIFILTERS="armeabi-v7a;arm64-v8a" -PRETRO_DISABLE_PLUS -PRETRO_REVISION=3
          mv app/build/outputs/apk/release/*.apk rsdkv5u_mania.apk

      # Step 5: Bundle Artifacts and Mods
      - name: Bundle Artifacts and Mods
        run: |
          ANDROID_PATH="$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5/dependencies/android"
          mkdir -p artifacts/mods
          cp -r $ANDROID_PATH/*.apk artifacts/

          # Bundle compiled mod assets/libraries
          mkdir -p artifacts/mods/MTC
          cp -r $ANDROID_PATH/app/jni/MTC/build/* artifacts/mods/MTC/ 2>/dev/null || true

          mkdir -p artifacts/mods/UWM
          cp -r $ANDROID_PATH/app/jni/UWM/build/* artifacts/mods/UWM/ 2>/dev/null || true

          # Bundle OGL Shader mod configuration
          mkdir -p artifacts/mods/GLShaders/Data/Shaders
          cp -r RSDKv5/Shaders/OGL artifacts/mods/GLShaders/Data/Shaders
          printf "Name=GLShaders\nDescription=OGLShaders\nAuthor=Ducky\nVersion=1.0.0\nTargetVersion=-1\n" > artifacts/mods/GLShaders/mod.ini
          printf "[Mods]\nMTC=y\nUWM=y\nGLShaders=y\n" > artifacts/mods/modconfig.ini

      # Step 6: Remove Every Symlink using $PWD
      - name: Remove Symlinks
        if: always()
        run: |
          JNI_DIR="$PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5/dependencies/android/app/jni"
          rm -f $JNI_DIR/Game
          rm -f $JNI_DIR/MTC
          rm -f $JNI_DIR/UWM
          rm -f $PWD/RSDKv5-Example-Mods/ManiaTouchControls/GameAPI
          rm -f $PWD/RSDKv5-Example-Mods/UltrawideMania/GameAPI
          rm -f $PWD/Sonic-Mania-Decompilation/dependencies/RSDKv5

      # Step 7: Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mania-android
          path: artifacts
